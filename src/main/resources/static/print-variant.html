<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печать варианта — Reshaemo</title>

    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        /* ── Base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 12pt;
            color: #000;
            background: #fff;
            padding: 0;
        }

        /* ── Screen: print preview wrapper ── */
        #print-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ── Loading overlay ── */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #f0f4ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: 'Segoe UI', sans-serif;
            z-index: 999;
        }
        #loading-screen h1 { font-size: 1.4rem; color: #1e3a8a; }
        #loading-screen p  { font-size: 0.9rem; color: #64748b; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #c7d2fe;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Error screen ── */
        #error-screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: 'Segoe UI', sans-serif;
            background: #fff1f2;
            z-index: 999;
        }
        #error-screen h1 { color: #be123c; }
        #error-screen p  { color: #64748b; }

        /* ── No-print button bar (screen only) ── */
        #action-bar {
            display: none;
            position: sticky;
            top: 0;
            background: #1e3a8a;
            color: #fff;
            padding: 0.8rem 2rem;
            z-index: 100;
            align-items: center;
            gap: 1rem;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.9rem;
        }
        #action-bar h1 { font-size: 1rem; flex: 1; }
        .print-btn {
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1.4rem;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }
        .print-btn:hover { background: #4338ca; }

        /* ── Document styles ── */
        .doc-title {
            text-align: center;
            font-size: 16pt;
            font-weight: bold;
            margin-bottom: 6pt;
        }
        .doc-meta {
            text-align: center;
            font-size: 10pt;
            color: #555;
            margin-bottom: 12pt;
        }
        .student-field {
            font-size: 11pt;
            margin-bottom: 18pt;
            border-bottom: 1px solid #000;
            padding-bottom: 4pt;
        }

        .task-block {
            margin-bottom: 18pt;
            page-break-inside: avoid;
        }
        .task-header {
            font-weight: bold;
            font-size: 12pt;
            color: #1e3a8a;
            margin-bottom: 5pt;
            border-bottom: 1px solid #93c5fd;
            padding-bottom: 2pt;
        }
        .task-content {
            font-size: 11.5pt;
            line-height: 1.55;
            margin-bottom: 6pt;
        }
        .task-images {
            display: flex;
            flex-wrap: wrap;
            gap: 8pt;
            margin-bottom: 6pt;
        }
        .task-images img {
            max-width: 260pt;
            max-height: 200pt;
            border: 1px solid #ccc;
        }
        .answer-line {
            border-bottom: 1px solid #000;
            margin-top: 8pt;
            height: 18pt;
        }

        /* ── Print media query ── */
        @media print {
            #action-bar   { display: none !important; }
            #loading-screen { display: none !important; }
            #error-screen   { display: none !important; }

            body { padding: 0; margin: 0; }
            #print-wrapper {
                max-width: 100%;
                padding: 10mm 15mm;
                margin: 0;
            }

            .task-block { page-break-inside: avoid; }
        }

        /* KaTeX formula sizing */
        .katex { font-size: 1em !important; }
        .katex-display { margin: 6pt 0 !important; }
    </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
    <div class="spinner"></div>
    <h1>Подготовка варианта к печати...</h1>
    <p>Загружаем задачи и формулы. Пожалуйста, подождите.</p>
</div>

<!-- Error screen -->
<div id="error-screen">
    <h1>⚠️ Ошибка загрузки</h1>
    <p id="error-msg">Не удалось загрузить данные варианта.</p>
    <p>Закройте эту вкладку и попробуйте снова.</p>
</div>

<!-- Print action bar (visible only on screen) -->
<div id="action-bar">
    <h1 id="action-title">Вариант</h1>
    <button class="print-btn" onclick="window.print()">🖨️ Распечатать / Сохранить как PDF</button>
    <button class="print-btn" style="background:#374151;" onclick="window.close()">✕ Закрыть</button>
</div>

<!-- Actual print content -->
<div id="print-wrapper"></div>

<script>
(function () {
    'use strict';

    // ── Parse URL params ──────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const variantId = params.get('id');
    const token = params.get('token');

    if (!variantId || !token) {
        showError('Отсутствуют обязательные параметры (id, token). Закройте эту вкладку.');
        return;
    }

    // ── Fetch variant data ────────────────────────────────────────────────────
    fetch(`/api/teacher/variants/${variantId}/print-data`, {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    })
    .then(variant => {
        renderVariant(variant);
    })
    .catch(err => {
        showError('Ошибка при получении данных: ' + err.message);
    });

    // ── Render ────────────────────────────────────────────────────────────────
    function renderVariant(v) {
        const wrapper = document.getElementById('print-wrapper');

        const examLabel = v.examType || '—';
        const subjectLabel = v.subject || '—';
        const bankLabel = v.taskBank || '—';
        const tasks = (v.tasks || []);

        let html = `
            <div class="doc-title">${escHtml(v.title || 'Вариант')}</div>
            <div class="doc-meta">Предмет: ${escHtml(subjectLabel)} | Экзамен: ${escHtml(examLabel)} | Банк: ${escHtml(bankLabel)}</div>
            <div class="student-field">ФИО ученика:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Дата:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</div>
        `;

        tasks.forEach((task, idx) => {
            const content = task.content || '';
            const images = (task.images || []);
            const hasAnswer = task.correctAnswer && task.correctAnswer.trim().length > 0;

            html += `
                <div class="task-block">
                    <div class="task-header">Задание №${idx + 1}${task.subtopic ? ' — ' + escHtml(task.subtopic) : ''}
                        <span style="font-weight:400;font-size:9pt;color:#555;"> (ID: ${escHtml(task.publicId || '')})</span>
                    </div>
                    <div class="task-content">${content}</div>
                    ${images.length ? `
                        <div class="task-images">
                            ${images.map(img => `<img src="${escHtml(img.url || '')}" alt="Изображение к заданию">`).join('')}
                        </div>
                    ` : ''}
                    ${hasAnswer ? `<div class="answer-line"></div>` : ''}
                </div>
            `;
        });

        wrapper.innerHTML = html;

        // Render KaTeX formulas
        waitForKaTeX(() => {
            try {
                renderMathInElement(document.getElementById('print-wrapper'), {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false
                });
            } catch (e) {
                console.warn('KaTeX render error:', e);
            }

            // Everything ready — show action bar
            document.getElementById('loading-screen').style.display = 'none';
            const bar = document.getElementById('action-bar');
            bar.style.display = 'flex';
            bar.querySelector('#action-title').textContent = v.title || 'Вариант';

            // Auto-open print dialog after a brief delay for fonts/images to load
            setTimeout(() => window.print(), 600);
        });
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function waitForKaTeX(callback, attempts) {
        attempts = attempts || 0;
        if (window.renderMathInElement) {
            callback();
        } else if (attempts < 60) {
            setTimeout(() => waitForKaTeX(callback, attempts + 1), 100);
        } else {
            console.warn('KaTeX not loaded in time — printing without math rendering');
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('action-bar').style.display = 'flex';
            setTimeout(() => window.print(), 300);
        }
    }

    function showError(msg) {
        document.getElementById('loading-screen').style.display = 'none';
        const errScreen = document.getElementById('error-screen');
        errScreen.style.display = 'flex';
        document.getElementById('error-msg').textContent = msg;
    }

    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
})();
</script>
</body>
</html>
