spring.application.name=test-platform

# Database (H2 file-based DB by default for local dev, overridden by env vars in Docker/PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./storage/db/test_platform;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File storage (images)
app.storage.images-path=${APP_STORAGE_IMAGES_PATH:./storage/images}

# Security / JWT
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:change-me-use-at-least-32-characters-secret-key-for-dev}
app.security.jwt.expiration-ms=86400000

# Default admin (created on first startup if missing)
app.security.default-admin.enabled=true
app.security.default-admin.login=admin
app.security.default-admin.password=admin123
app.security.default-admin.display-name=Администратор

# UTF-8 Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# File upload limits (ZIP import with tasks + images)
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
server.tomcat.max-swallow-size=512MB

# Hibernate Batching Optimization (10x-20x faster bulk imports)
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


