spring.datasource.url=jdbc:h2:mem:test_platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.security.jwt.secret=test-secret-key-at-least-32-characters-long
app.security.jwt.expiration-ms=3600000
app.security.default-admin.enabled=false
